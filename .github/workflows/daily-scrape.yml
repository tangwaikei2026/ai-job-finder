name: Daily Raw Job Collection

on:
  schedule:
    - cron: '0 1 * * *'   # UTC 01:00 = 北京时间 09:00
    - cron: '0 9 * * *'   # UTC 09:00 = 北京时间 17:00
  workflow_dispatch:
    inputs:
      platform:
        description: '指定单个平台（留空则采集全部已启用平台）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  collect-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m playwright install chromium --with-deps
      - name: Collect raw jobs
        run: |
          if [ -n "${{ github.event.inputs.platform }}" ]; then
            python -m src.main --platform "${{ github.event.inputs.platform }}"
          else
            python -m src.main
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: raw-job-data
          path: data/raw/
          if-no-files-found: warn
          retention-days: 7
