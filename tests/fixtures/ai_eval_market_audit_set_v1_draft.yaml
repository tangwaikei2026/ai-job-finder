    1. Agent Evaluation 体系建设：设计和建设 Agent 离线与在线评测体系，包括 Dataset、Rubric、Evaluator、LLM-as-Judge、Human Evaluation、Regression Evaluation 等能力，支持不同 Agent 场景建立清晰、可量化的效果标准。
