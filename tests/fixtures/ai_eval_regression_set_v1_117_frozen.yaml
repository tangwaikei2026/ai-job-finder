title: "测试开发工程师-抖音搜索"
description: |-
  1、负责抖音搜索产品研发全流程的质量闭环，包括但不限于：产品方案评审、测试方案设计、测试执行，以及线上线下的质量分析等；
  2、发现工作中的痛点、低效问题，并能结合AI技术进行系统性提效提质建设，将大模型能力应用到质量保障各环节中，包括但不限于：基于LLM的测试用例生成、基于多模态模型的效果评测与异常检测、基于Agent的自动化测试与问题归因分析，从挖掘场景→方案设计→技术落地→收益度量全流程参与；
  3、负责建立质量度量标准，对项目问题进行监控、定位及排查，驱动产品质量提升；
  4、关注行业前沿技术（LLM、多模态模型、AIGC等），学习研究新技术，不断丰富团队内的测试能力；
  5、与产品、研发团队建立高效协作流程，并对产品提出改进建议，基于AICoding探索新的质量保障范式，提升用户产品体验。
requirements: |-
  1、本科及以上学历，计算机相关专业优先，具备良好的沟通协作和问题分析能力；
  2、掌握一种或多种语言，如Python/Node.js/Java/OC，熟悉服务端、客户端常用的测试工具和测试框架；
  3、熟悉端到端的敏捷测试流程，了解测试左移和测试右移的思想，有较好的质量运营意识；
  4、具备AI大模型相关技术实践经验，有以下一个或多个方向的实际落地经验优先：LLM应用（Prompt Engineering、RAG、Agent等）、多模态模型（图像/视频理解、生成模型）、模型微调（SFT/LoRA/DPO等）、AI在测试领域的应用（如自动生成用例、智能评测、缺陷分析等）。
