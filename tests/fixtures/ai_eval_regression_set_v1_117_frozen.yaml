  4、AI能力：了解大模型、Agent、RAG、AI Coding等相关技术，对AI应用及测试验证有兴趣，具备较强的AI工具使用和提效意识。
  5、工程与质量意识：具备较强的风险识别、问题分析和质量意识，能够主动发现潜在问题，并推动问题闭环。
