  3、推进AI原生研发测试范式落地，建设需求理解、用例生成、代码检查、自动化测试、缺陷定位和回归验证等智能化能力；
  4、负责E2E测试能力建设，提升生成用例采纳率、执行成功率、结果稳定性和问题发现效率，形成“生成—执行—诊断—修复—重跑”闭环；
  5、沉淀AI质效建设方法论、最佳实践和标准规范，提升团队整体AI工程化和质量保障能力。
