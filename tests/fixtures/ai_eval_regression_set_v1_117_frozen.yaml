title: "应用产品高级测试工程师"
description: |-
  1.负责C端业务的客户端与服务端测试，覆盖功能、性能、稳定性、兼容性等环节，守护端到端的产品体验；
  2.从0到1建设并完善过程质量体系，通过深度用例设计与复杂场景构造，持续提升核心模块高风险缺陷的提前暴露能力；
  3.参与算法和大模型相关的评测工作，力求评判标准科学严谨，以数据驱动发现质量薄弱环节，推动过程质量与运营质量的持续改进；
  4.具备"端云协同"架构下的全链路质量把控能力，独立完成复杂链路拆解、疑难问题复现与根因定位，输出有效的防御与改进策略；
  5.关注AI技术发展，主动探索AI如何落地到测试和评测，赋能提质增效有自己的理解和想法，愿意主动探索并推动新方法在团队内生根发芽。
requirements: |-
  1.3-5年及以上软件测试/测试开发经验，具备扎实的测试基本功，能独立完成从需求分析、用例设计到执行验证的全链路质量把控；
  2.具备"端云协同"架构（内核+云+端）的测试经验，擅长复杂链路拆解与疑难问题复现两大核心能力；
  3.掌握至少一项测试专项技术（自动化测试、性能测试、稳定性测试、数据驱动测试等），并能在实际业务中产出可量化的质量收益；
  4.具备较强的问题定位与根因分析能力，能独立完成复杂问题的排查归因，并输出有效的防御与改进方案；
  5.能理解并实践AI/ML在测试领域的应用，比如用AI做测试管理、缺陷分析、质量预测等，对新鲜技术愿意“上手试一试”并推进落地；
  6.视质量为生命线，习惯"多问几个为什么"，具备良好的跨团队协作与向上沟通能力，主动沉淀可复用的测试方法与最佳实践。
company: "腾讯"
location: "北京"

