title: "测试开发工程师（搜索LLM）-TikTok内容发现（北京/上海）"
description: |-
  团队介绍：TikTok是一个覆盖150个国家和地区的国际短视频平台，我们希望通过TikTok发现真实、有趣的瞬间，让生活更美好。TikTok在全球各地设有办公室，全球总部位于洛杉矶和新加坡，办公地点还包括纽约、伦敦、都柏林、巴黎、柏林、迪拜、雅加达、首尔和东京等多个城市。
  
  TikTok内容发现团队负责的产品功能涵盖TikTok所有内容分发的场景，包括首页的搜索、推荐信息流等核心场景，通过个性化手段以及产品功能来满足用户发现内容的诉求。在这里，有大牛带队与大家一同不断探索前沿，突破想象空间。在这里，你的每一行代码都将服务亿万用户。在这里，团队专业且纯粹，合作氛围平等且轻松。
  
  1、负责TikTok搜索LLM方向质量保障工作，构建大模型相关质量体系，参与变更管控、自动化测试、LLM评测、LLM安全等质效专项；
  2、基于工程和算法团队现有质效问题给出合理质效解决方案，推动落地提高交付质效；
  3、能及时关注和学习，并探索新的大模型相关质效解决方案。
requirements: |-
  1、本科及以上学历，计算机相关专业，精通测试流程、方法和工具；
  2、扎实的编程基础，熟练使用Python/Go/Java/C++其中一种或多种语言；
  3、具备持续学习和创新意识，勇于尝试新技术和新方法；
  4、对AIGC技术有深入的理解和一定的经验，对大模型领域有热情，有AI相关测试开发和评测经验者优先。
