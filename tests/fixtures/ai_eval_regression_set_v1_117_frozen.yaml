title: "AI评测工程师"
description: |-
  1.负责医疗 Agent 核心业务的质量评测工作，覆盖健康问问、AI 诊室、医保智能助手等场景，围绕意图理解、多轮交互、信息收集、工具调用、结果生成、异常兜底等关键环节，完成评测方案设计、落地、结果记录与问题反馈；
  2.参与医疗复杂场景专项评测，包括 AI 问诊流程、科室/服务匹配、医保政策问答与办理指引、多模态报告解读等场景，沉淀可量化、可复用的评测方法和评估标准；
  3.推动评测数据与自动化能力建设，建设高质量评测集、标准答案、链路 Trace 标注规范和评测流水线，支持人工评测、规则评测及自动化评测任务落地；
  4.跟进线上 Badcase 分析与问题闭环，针对医疗安全、内容安全、隐私合规、诊疗建议边界等高风险问题，协助定位问题原因，并推动产品、算法、研发侧跟进修复。
requirements: |-
  1.计算机或相关专业本科及以上学历，具备基本的软件测试与质量保障知识，理解测试用例设计、缺陷跟踪等基础测试流程；
  2.熟悉 LLM、Agent、RAG、工具调用等大模型应用的核心概念及其基本技术实现方式，对 AI 产品质量评测、Agent 链路评测等工作方向有兴趣，愿意长期投入 AI 评测与质量保障领域；
  3.具备较好的逻辑分析能力和问题拆解能力，能够根据业务场景设计基础测试点，准确记录问题现象，并进行初步的问题归类和原因分析；
  4.具备一定的数据处理和工具使用能力，熟悉 Python、SQL、Excel 或其他数据分析工具之一，能够完成复杂的数据清洗、结果统计、日志查看或脚本辅助工作；
  5.具备良好的学习能力、沟通能力和责任心。
