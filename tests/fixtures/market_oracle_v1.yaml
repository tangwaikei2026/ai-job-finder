  title: 千问办公-AI Agent产品经理-杭州
  description: |
    这个岗位不只负责某个页面或单点功能，而是围绕 Agent 如何理解任务、调用工具、与用户协作并最终交付结果，持续优化 Web、桌面客户端和移动场景中的完整产品体验。
    我们希望找到一位对 AI Agent 有真实兴趣、愿意动手验证、能够跨产品、设计和技术推进事情的人。你需要能从真实工作流中发现问题，把不确定的模型能力变成可测试的产品方案，并推动它稳定上线。
    你将负责
    1. Agent 核心体验
    负责千问办公 Agent 从任务发起到结果交付的完整链路，包括多轮协作、Session、工具调用、权限确认、过程反馈和异常恢复。
    将 Context、Memory、项目空间、历史任务、文件和产物融入 Agent 主链路，让 Agent 在用户授权和可控的前提下理解已有信息。
    推动 Web、桌面客户端和移动场景体验一致，并探索自然、清晰、不过度打扰的人机协作方式。
    2. 场景与能力产品化
    从不同领域的真实工作流出发，发现适合由 Agent 解决的高价值问题，并将用户痛点转化为可实现、可验证的产品能力。
    负责 PPT、文档、表格、PDF 等生产力能力的体验和质量，关注内容、结构、版式、过程反馈和失败恢复。
    将 Skills、专家套件、MCP Apps、连接器和定时任务自然接入 Agent，并与钉钉消息、文档、AI 表格、AI 听记、日历、待办和审批等企业能力形成连贯体验。
    关注不同 Harness、工具协议及企业场景中的权限、安全和数据边界，并转化为清楚、可验证的产品方案。
    3. 模型效果与验证交付
    理解不同模型和 Harness 在能力、成本、速度和适用场景上的差异，将选择逻辑转化为用户可理解的体验。
    建立 Agent 任务评测方法，结合模型、Prompt、Context、工具和 Skills 定位问题，关注任务完成率、人工介入、产物质量、时延和成本。
    使用原型、简单代码或 AI 编程工具制作可运行 Demo，通过真实用户反馈、灰度和数据分析尽快验证产品假设。
    与设计、前后端、算法、测试、运营和企业客户协作，明确范围、优先级、依赖、风险和验收标准，并推动产品稳定上线。
  requirements: |-
    我们希望你具备
    有完整产品或核心模块从问题发现、方案设计、研发协同到上线迭代的实际经验；不以工作年限作为主要判断标准。
    做过 AI Agent、AI 办公、Copilot、文档协作、IM 协同、桌面客户端或复杂工具型产品中的至少一种。
    理解 LLM 与 Agent 的基础机制，包括 Context、Memory、工具调用、任务规划、权限、人机协作、评测和常见失败模式。
    能把复杂能力拆成清楚的用户链路、状态和产品边界，并写出研发可执行、设计可落地、测试可验收的方案。
    对 Web、桌面客户端和移动端的交互差异有基本理解，能够判断跨端一致性与端侧能力边界。
    具备数据与实验意识，能够用任务集、用户反馈和灰度结果验证产品判断。
    愿意动手制作原型或简单 Demo；不要求成为专业工程师，但需要能借助代码和 AI 工具快速把想法变成可体验的东西。
    具备较强的用户同理心、产品判断和项目推动能力，能够在快速变化和信息不完整的环境中持续推进。


