  title: 千问办公-算法工程师-AI办公
  description: |
    1. 智能体架构与模型记忆：
    主导办公场景下智能体核心算法的设计与优化，涵盖任务规划、工具调用（Function Calling / MCP）、记忆调度等关键模块，提升智能体在复杂办公任务中的自主决策与执行能力。
    运用 RAG、向量检索、长短期记忆等技术构建模型记忆系统，为智能体提供可靠的知识获取与上下文召回能力。
    结合思维链（CoT）、思维树（ToT）等复杂推理技术，赋予智能体独立探索和解决复杂难题的能力。
    与工程团队协作，在有限推理算力下构建完整可落地的 Agentic Workflow 解决方案，推动智能体能力在产品中的集成上线。
    2. 评测体系：
    围绕企业级办公场景构建评测体系，覆盖任务理解、知识问答、工具调用等关键环节，建立自动化评测、人工评审与回归测试机制，支撑模型与智能体版本迭代的量化决策。
    设计实验验证不同技术路线在真实数据与任务下的效果，为方案选型与持续优化提供数据支撑。
    3. 多模态与垂类能力建设：
    将大模型与多模态能力适配到具体办公产品功能中，包括但不限于 AI 文本生成、代码生成、文生图、文档图像识别与理解等方向。完成 Prompt 工程、垂类微调等能力的业务实现，满足办公场景下的多样化 AI 需求。
    参与产品功能从需求分析到部署上线的全流程开发，保障技术方案高效落地并持续进行性能调优。
    4. 模型优化：
    负责大模型后训练相关工作，包括 SFT（监督微调）、偏好优化（DPO/RLHF 等）、强化学习（RL）等方法的应用，提升模型在办公业务场景中的稳定性、准确性和可控性。
    建设数据飞轮，沉淀用户反馈与交互日志，形成可用于训练和效果回归的数据资产，支撑模型版本持续迭代。
