    团队简介
    我们正在组建一支 AI 安全团队，使命是把顶尖的安全能力与大模型深度结合：一方面攻克高价值的安全难题，将专家经验沉淀为数据、Benchmark 与自动化框架，持续提升基础模型的网络安全能力；另一方面将这些能力落地到真实业务场景，守护公司安全水位，并用实战反哺模型迭代。
    这是一支兼具研究深度与工程能力的团队，我们既欢迎在某一安全领域深耕多年的专家，也欢迎能够搭建安全平台与基础设施的资深工程师与架构师。

    岗位职责
    定义高价值的安全问题，沉淀标准化方法、数据集、Benchmark 与 Harness ，并与算法团队协作，将专家经验转化为基础模型的网络安全能力；
    在逆向工程、漏洞发现与修补、漏洞利用与验证、渗透测试与红蓝对抗、安全运营等方向中深入钻研，推动相关能力的研究与产品化；
    将安全能力应用于公司真实业务场景，识别并收敛安全风险，提升整体安全水位，并将实战经验反哺模型与自动化框架；
    参与公司安全架构、安全数据中台、安全运营底座与 AI 安全基础设施的设计与建设，为安全研究提供平台化、规模化的工程支撑；
    与团队成员按项目灵活协作、互为支援，共同推动 AI 与安全的结合落地。
  requirements: |-
    任职要求
    计算机科学、网络安全、软件工程或相关领域背景；
    在以下至少一个方向具备深入的实战经验：逆向工程、漏洞发现与修补、漏洞利用与验证、渗透测试与红蓝对抗、安全运营；或具备扎实的全栈工程与系统架构能力，并对安全有深入理解；
    具备出色的问题定义与抽象能力，能将复杂、模糊的安全需求转化为可度量、可沉淀的方法与工具；
    良好的跨团队协作能力与Ownership，能够在研究与工程之间灵活切换。

