  title: AI解决方案销售经理（零售/金融方向）
  description: |-
    我们是京东人工智能业务，作为京东科技集团旗下专注于以AI技术为政企客户服务的单元，致力于为零售、金融、政府、制造等各类客户提供全价值链的AI技术性产品与服务，助力千行百业的数字化转型与升级，实现高质量发展。基于自研的JoyAI大模型，为近6亿用户、75万商家提供7*24小时服务，涵盖客户服务、交互式营销、云联络中心等整体解决方案，涉及售前、售中、售后等全链条。

    【核心职责】
    1.市场开拓与商机控掘：负责公司AI大模型应用产品（含智能客服、数字员工、AI营销等）在零售、电商、金融（银行/保险/消费金融）、BPO等行业的客户拓展；主动出击，通过多渠道控掘潜在客户，建立并维护高质量的Pipeline;
    2.全流程销售闭环：独立负责从客户触达、需求诊断、方案呈现、商务谈判到合同签署及回款的全销售周期管理；精准识别客户关键决策人，构建并维护多维度客户关系;
    3.价值传递与方案设计：深入理解客户业务场景痛点，将复杂的技术能力（如大模型、SαaS平台）翻译为清晰的业务价值（ROI）和可落地的解决方案；协同售前与产品团队，确保方案的专业性与竞争力;
    4.客户成功与长期经营：不仅关注成交，更关注客户长期成功。持续跟踪项目交付效果，控掘客户全生命周期的深度价值，推动续约、增购与交叉销售，将客户转化为长期战略伙伴;
    5.市场洞察与反馈：作为市场一线触角，敏锐捕捉行业动态、竞品信息及客户需求变化，驱动内部产品与服务持续迭代优化。
  requirements: |-
    【任职要求】
    1.经验门槛：统招本科及以上学历，3年以上ToB大客户销售经验，其中至少1年涉及SaaS软件、AI平台或大数据产品的销售或解决方案工作；拥有完整的独立打单经验，从客户开发、方案设计到商务落地的闭环能力;
    2.商业敏锐度：对零售、电商或金融行业的业务逻辑有深刻认知，能快速诊断客户痛点，并将AI能力与客户需求精准对接;
    3.自驱与坚韧：具备极强的自我驱动力和结果导可意识，适应快节奏、高挑战的创新业务环境;
    4.学习与创新：热爱AI技术，对ChatGPT、大模型应用等前沿领域有强烈好奇心，能快速学习新知识并转化为销售话术和解决方案。

    【加分项】
    1.在零售电商平台、消费金融、银行信用卡中心、保险电销、催收机构或大型BPO服务商等领域有深厚的客户资源积累;
    2.有大模型外呼、智能客服、营销自动化、RPA或数字员工等产品的实战销售与交付经验;
    3.具备渠道拓展、生态伙伴合作或战略客户经营的成功经验。

    符合京东价值观：客户为先、创新、拼搏、担当、感恩、诚信。
