    3、深入理解LLM/RAG/Agent技术栈，对主流框架（LangGraph/AutoGen/MCP/A2A等）有深刻理解，能判断技术选型的能力边界，具备独立设计新范式的能力；
    4、具备跨团队推动复杂项目落地的经验，能与产品、算法、前端、上下游平台高效对齐，能够将模糊需求转化为清晰的技术方案与里程碑；
