    2、熟悉内容生态运作机制，深刻理解平台风险类型与治理逻辑，具备清晰的平台合规与生态导向判断力，有完整内容生态治理项目经验者优先；
    3、掌握大模型应用迭代方法论，具备扎实提示词工程能力（结构化表达、模板化设计、版本管理、回归测试），有内容分析、风险识别、违规治理场景落地经验者优先；
