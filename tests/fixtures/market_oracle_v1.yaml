    3、AI Agent与智能体开发：设计并实现基于大语言模型的智能体(Agent)系统架构，包括任务理解、规划、执行和反馈循环等核心模块。熟练运用Function Calling/Tooling机制，将模型能力与内外部API、工具和服务进行安全、可靠的集成。
