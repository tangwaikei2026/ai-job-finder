    2. 对 AI Agent 具备基础的工程认知，具备使用大模型 / Agent 解决实际业务问题并真实落地的案例；理解工具调用、上下文管理、多 Agent 编排、Eval 的作用与能力边界。能针对测试场景设计并落地 Agent 或工具链（需求解析、用例生成、执行编排、结果裁决等），了解模型幻觉、输出不稳定等问题的工程化应对方法；
    3. 熟悉互联网产品的设计开发流程，具备用户型产品的功能、性能、稳定性测试经验，以及线上稳定性与体验水位监控、问题分析能力；有网盘、知识库、图像/视频等复杂链路和效果评测经验者优先（如 文档总结、知识文档、AI写作、AI 生图等）；
    4. 有数据驱动意识，能把质量目标拆成口径清晰、可被追问的指标（如有效缺陷、线上漏出率、首包耗时、效果通过率、Skill 采纳率），用数据辅助质量决策、体验提升与业务目标达成；
    5. 良好的沟通协作能力，目标导向；有好奇心和探索能力，面对不确定需求场景能主动定义问题、推动对齐解决；对测试领域和效能工程有热情，愿意把个人实践抽象成可被他人复用的方法论或工具，并在团队内外分享。
